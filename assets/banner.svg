<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Agent in a Box</title>
<desc id="d">A chalkboard drawing of a particle in a box: two infinite walls, three energy levels with their standing waves, and a small robot as the particle. One attempted request is stopped at the wall.</desc>
<defs>
  <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d3b31"/><stop offset="1" stop-color="#15291f"/>
  </linearGradient>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#f3f1e6" stroke-width="1.6" stroke-opacity="0.55"/>
  </pattern>
  <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
  </filter>
</defs>
